        body {

            line-height: 1.6;

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(13, 13, 17, 0.9);

            padding: 15px 20px;

        .nav-container {

            align-items: center;

        .nav-logo {

            font-size: 1.4rem;

            text-transform: uppercase;
        }
        .nav-logo span { color: #e60000; font-style: italic; }
        nav a {
            color: #ffffff;

            margin-left: 20px;
            font-weight: 600;
            font-size: 0.9rem;

        nav a:hover { color: #e60000; }

        /* --- HERO CON VIDEO EN VIVO --- */
        .hero-video-section {

            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 4px solid #e60000;
        }
        /* Contenedor del video */
        .video-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }
        /* Capa oscura superior para dar contraste */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(13,13,17,0.5) 0%, rgba(13,13,17,0.95) 100%);
            z-index: -1;
        }

            display: inline-block;

        }

        .logo-main .es-part {
            display: inline-block;
            position: relative;
            top: -10px;
        }
        .logo-main .mecanica-tag {
            font-size: 1.1rem;
            letter-spacing: 4px;
            position: absolute;
            bottom: -22px;
            right: 5px;
            color: #ffffff;
            font-weight: 700;
        }
        .hero-video-section .subtitle {
            font-size: 1.3rem;
            color: #cccccc;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-top: 50px;
            text-align: center;
        }

        .container {

            margin: 0 auto;
            padding: 60px 20px;
        }

            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-align: center;
        }

            content: '';
            display: block;
            width: 70px;
            height: 3px;
            background: #e60000;
            margin: 12px auto 0 auto;
        }
