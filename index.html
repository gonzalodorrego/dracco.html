<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecánica Torres - Taller Mecánico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            padding-top: 40px;
        }
        .logo-placeholder {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .logo-rr {
            color: #e60000;
            font-size: 4.5rem;
            font-style: italic;
            line-height: 1;
            margin-bottom: 20px;
            display: block;
        }
        .subtitle {
            font-size: 1.2rem;
            color: #cccccc;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 40px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .services-list {
            text-align: left;
            margin-bottom: 40px;
            list-style: none;
        }
        .services-list li {
            padding: 12px 15px;
            margin-bottom: 10px;
            background: #1a1a1a;
            border-radius: 5px;
            display: flex;
            align-items: center;
            font-size: 1.1rem;
        }
        .services-list li span {
            margin-right: 15px;
            font-size: 1.3rem;
        }
        .contact-box {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 10px;
            border-top: 4px solid #e60000;
        }
        .btn-whatsapp {
            display: inline-block;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 15px;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        .btn-whatsapp:hover {
            background-color: #1ebd58;
        }
        .address {
            margin-top: 15px;
            color: #aaa;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-placeholder">TO<span style="color:#e60000">RR</span>ES</div>
        <div class="subtitle">Mecánica en General</div>

        <ul class="services-list">
            <li><span>🔧</span> Service</li>
            <li><span>⚙️</span> Distribución</li>
            <li><span>📋</span> Revisión para VTV</li>
            <li><span>🚘</span> Tren delantero</li>
            <li><span>🛠️</span> Tapas de cilindro</li>
            <li><span>💻</span> Diagnóstico computarizado</li>
            <li><span>⚡</span> Electromecánica e inyección</li>
        </ul>

        <div class="contact-box">
            <h3>Turnos y consultas:</h3>
            <a href="https://wa.me/5491134339916" target="_blank" class="btn-whatsapp">
                💬 Solicitar Turno por WhatsApp
            </a>
            <p class="address">📍 José C Paz 1568, General Rodríguez</p>
        </div>
    </div>

</body>
</html>
